<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -36 800 336" width="800" height="336" role="img" aria-label="srt -c 'copilot --yolo': the kernel sandbox confines the whole agent process"><title>srt -c 'copilot --yolo': the kernel sandbox confines the whole agent process</title><style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.n rect { fill: #fff; stroke: #818b98; stroke-width: 1.5; }
.n.accent rect { stroke: #0969da; } .n.success rect { stroke: #1a7f37; }
.n.danger rect { stroke: #d1242f; } .n.attention rect { stroke: #9a6700; }
.n.muted rect { stroke: #d1d9e0; stroke-dasharray: 4 3; }
.n text { font-size: 13px; font-weight: 600; fill: #1f2328; }
.n text.sub { font-size: 11px; font-weight: 400; fill: #59636e; }
.n text.ln { font-size: 11.5px; font-weight: 400; fill: #1f2328; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-weight: 400; }
.e { fill: none; stroke: #818b98; stroke-width: 1.5; }
.e.dashed { stroke-dasharray: 5 4; } .e.strong { stroke-width: 2.5; }
.e.accent { stroke: #0969da; } .e.success { stroke: #1a7f37; }
.e.danger { stroke: #d1242f; } .e.attention { stroke: #9a6700; }
.el { font-size: 11px; fill: #59636e; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.lg { font-size: 12px; fill: #59636e; }
.grp rect { fill: #f6f8fa; stroke: #d1d9e0; stroke-dasharray: 6 4; }
.grp text { font-size: 12px; font-weight: 600; fill: #59636e; }
</style><rect x="0" y="-36" width="800" height="336" fill="#fff"/><defs><marker id="srt-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#818b98"/></marker><marker id="srt-accent" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="srt-success" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="srt-danger" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d1242f"/></marker><marker id="srt-attention" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker></defs><g class="grp"><rect x="206" y="4" width="388" height="292" rx="8"/><text x="216" y="20">srt kernel sandbox: deny paths, write allowlist, domain allowlist</text></g><path class="e " d="M193,170 Q200,170 214,170" marker-end="url(#srt-neutral)"/><path class="e " d="M386,139.9 Q400,135 414,130.1" marker-end="url(#srt-neutral)"/><path class="e " d="M386,200.1 Q400,205 414,209.9" marker-end="url(#srt-neutral)"/><path class="e success strong" d="M586,130.1 Q600,135 617.1428571428571,141" marker-end="url(#srt-success)"/><path class="e success strong" d="M586,209.9 Q600,205 617.1428571428571,199" marker-end="url(#srt-success)"/><g class="n accent"><rect x="10" y="138" width="180" height="64" rx="6"/><text x="22" y="159">srt -c 'copilot --yolo'</text><text class="ln" x="22" y="175">loads, loss-less:</text><text class="ln" x="22" y="191"><tspan class="mono">~/.srt-settings.json</tspan></text></g><g class="n "><rect x="217" y="138" width="166" height="64" rx="6"/><text x="229" y="159">copilot --yolo</text><text class="sub" x="229" y="175">agent process</text><text class="ln" x="229" y="191">own path, URL checks off</text></g><g class="n "><rect x="417" y="68" width="166" height="64" rx="6"/><text x="429" y="89">Built-in tools</text><text class="ln" x="429" y="105">Read · Edit · WebFetch</text><text class="ln" x="429" y="121">run inside the agent</text></g><g class="n "><rect x="417" y="208" width="166" height="64" rx="6"/><text x="429" y="229">Spawned commands</text><text class="ln" x="429" y="245">shell, MCP servers</text><text class="ln" x="429" y="261">and their children</text></g><g class="n "><rect x="610" y="144" width="180" height="52" rx="6"/><text x="700" y="175" text-anchor="middle">Files · secrets · network</text></g><line class="e success strong" x1="12" x2="44" y1="-18" y2="-18"/><text class="lg" x="52" y="-14">enforced by the kernel sandbox</text></svg>
