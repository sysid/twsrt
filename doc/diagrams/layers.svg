<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -36 800 472.8" width="800" height="472.8" role="img" aria-label="Two enforcement layers: agent permissions for every tool, the kernel sandbox for every spawned command"><title>Two enforcement layers: agent permissions for every tool, the kernel sandbox for every spawned command</title><style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.n rect { fill: #fff; stroke: #818b98; stroke-width: 1.5; }
.n.accent rect { stroke: #0969da; } .n.success rect { stroke: #1a7f37; }
.n.danger rect { stroke: #d1242f; } .n.attention rect { stroke: #9a6700; }
.n.muted rect { stroke: #d1d9e0; stroke-dasharray: 4 3; }
.n text { font-size: 13px; font-weight: 600; fill: #1f2328; }
.n text.sub { font-size: 11px; font-weight: 400; fill: #59636e; }
.n text.ln { font-size: 11.5px; font-weight: 400; fill: #1f2328; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-weight: 400; }
.e { fill: none; stroke: #818b98; stroke-width: 1.5; }
.e.dashed { stroke-dasharray: 5 4; } .e.strong { stroke-width: 2.5; }
.e.accent { stroke: #0969da; } .e.success { stroke: #1a7f37; }
.e.danger { stroke: #d1242f; } .e.attention { stroke: #9a6700; }
.el { font-size: 11px; fill: #59636e; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.lg { font-size: 12px; fill: #59636e; }
.grp rect { fill: #f6f8fa; stroke: #d1d9e0; stroke-dasharray: 6 4; }
.grp text { font-size: 12px; font-weight: 600; fill: #59636e; }
</style><rect x="0" y="-36" width="800" height="472.8" fill="#fff"/><defs><marker id="layers-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#818b98"/></marker><marker id="layers-accent" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="layers-success" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="layers-danger" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d1242f"/></marker><marker id="layers-attention" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker></defs><g class="grp"><rect x="206" y="4" width="388" height="283.2" rx="8"/><text x="216" y="20">agent process</text></g><g class="grp"><rect x="206" y="300.40000000000003" width="388" height="127.19999999999999" rx="8"/><text x="216" y="316.40000000000003">Layer 1: kernel sandbox</text></g><path class="e " d="M173,156 Q200,156 211,156" marker-end="url(#layers-neutral)"/><path class="e " d="M389,125.918 Q400,122.2 413,117.80600000000001" marker-end="url(#layers-neutral)"/><path class="e " d="M389,197.65200000000002 Q400,202.8 438.034188034188,220.6" marker-end="url(#layers-neutral)"/><path class="e " d="M500,278.6 Q500,312 500,331.40000000000003" marker-end="url(#layers-neutral)"/><path class="e attention strong" d="M549.8575498575499,123.4 Q600,158.6 658.6894586894587,199.79999999999998" marker-end="url(#layers-attention)"/><path class="e success strong" d="M559.065934065934,331.40000000000003 Q600,301.6 660.1648351648352,257.79999999999995" marker-end="url(#layers-success)"/><g class="n muted"><rect x="30" y="130" width="140" height="52" rx="6"/><text x="100" y="153" text-anchor="middle">Tool call</text><text class="sub" x="100" y="169" text-anchor="middle">from the model</text></g><g class="n accent"><rect x="214" y="116" width="172" height="80" rx="6"/><text x="226" y="137">Layer 2: permissions</text><text class="sub" x="226" y="153">agent's own engine</text><text class="ln" x="226" y="169">deny / ask / allow</text><text class="ln" x="226" y="185">every tool call</text></g><g class="n "><rect x="416" y="56.400000000000006" width="168" height="64" rx="6"/><text x="428" y="77.4">Built-in tools</text><text class="ln" x="428" y="93.4">Read · Edit · WebFetch</text><text class="ln" x="428" y="109.4">run inside the agent</text></g><g class="n "><rect x="416" y="223.6" width="168" height="52" rx="6"/><text x="500" y="246.6" text-anchor="middle">Bash tool</text><text class="sub" x="500" y="262.6" text-anchor="middle">spawns a process</text></g><g class="n "><rect x="416" y="334.40000000000003" width="168" height="80" rx="6"/><text x="428" y="355.40000000000003">Spawned command</text><text class="ln" x="428" y="371.40000000000003">deny paths</text><text class="ln" x="428" y="387.40000000000003">write allowlist</text><text class="ln" x="428" y="403.40000000000003">domain allowlist (proxy)</text></g><g class="n "><rect x="610" y="202.79999999999998" width="180" height="52" rx="6"/><text x="700" y="233.79999999999998" text-anchor="middle">Files · secrets · network</text></g><line class="e attention strong" x1="12" x2="44" y1="-18" y2="-18"/><text class="lg" x="52" y="-14">agent permissions only</text><line class="e success strong" x1="219" x2="251" y1="-18" y2="-18"/><text class="lg" x="259" y="-14">also enforced by the kernel</text></svg>
