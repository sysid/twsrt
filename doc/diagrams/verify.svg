<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -36 800 307.4" width="800" height="307.4" role="img" aria-label="Three read-only checks, one per step from fragments to enforcement"><title>Three read-only checks, one per step from fragments to enforcement</title><style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.n rect { fill: #fff; stroke: #818b98; stroke-width: 1.5; }
.n.accent rect { stroke: #0969da; } .n.success rect { stroke: #1a7f37; }
.n.danger rect { stroke: #d1242f; } .n.attention rect { stroke: #9a6700; }
.n.muted rect { stroke: #d1d9e0; stroke-dasharray: 4 3; }
.n text { font-size: 13px; font-weight: 600; fill: #1f2328; }
.n text.sub { font-size: 11px; font-weight: 400; fill: #59636e; }
.n text.ln { font-size: 11.5px; font-weight: 400; fill: #1f2328; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-weight: 400; }
.e { fill: none; stroke: #818b98; stroke-width: 1.5; }
.e.dashed { stroke-dasharray: 5 4; } .e.strong { stroke-width: 2.5; }
.e.accent { stroke: #0969da; } .e.success { stroke: #1a7f37; }
.e.danger { stroke: #d1242f; } .e.attention { stroke: #9a6700; }
.el { font-size: 11px; fill: #59636e; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.lg { font-size: 12px; fill: #59636e; }
.grp rect { fill: #f6f8fa; stroke: #d1d9e0; stroke-dasharray: 6 4; }
.grp text { font-size: 12px; font-weight: 600; fill: #59636e; }
</style><rect x="0" y="-36" width="800" height="307.4" fill="#fff"/><defs><marker id="verify-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#818b98"/></marker><marker id="verify-accent" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="verify-success" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="verify-danger" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d1242f"/></marker><marker id="verify-attention" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker></defs><path class="e " d="M153,59 Q240,59 327,59" marker-end="url(#verify-neutral)"/><path class="e  dashed" d="M473,59 Q560,59 647,59" marker-end="url(#verify-neutral)"/><path class="e accent dashed" d="M85.66779661016949,163.5 Q84,132.75 81.5728813559322,88" marker-end="url(#verify-accent)"/><path class="e accent dashed" d="M261.3694915254237,163.5 Q208,132.75 130.3322033898305,88" marker-end="url(#verify-accent)"/><path class="e accent dashed" d="M354.6576271186441,163.5 Q368,132.75 387.4169491525424,88" marker-end="url(#verify-accent)"/><path class="e accent dashed" d="M570.0338983050848,163.5 Q520,132.75 447.1864406779661,88" marker-end="url(#verify-accent)"/><path class="e accent dashed" d="M663.3220338983051,163.5 Q680,132.75 704.271186440678,88" marker-end="url(#verify-accent)"/><g class="n "><rect x="10" y="33" width="140" height="52" rx="6"/><text x="80" y="56" text-anchor="middle">Fragments</text><text class="sub" x="80" y="72" text-anchor="middle">+ config.toml</text></g><g class="n "><rect x="330" y="33" width="140" height="52" rx="6"/><text x="400" y="56" text-anchor="middle">Files on disk</text><text class="sub" x="400" y="72" text-anchor="middle">canonical + agents</text></g><g class="n muted"><rect x="650" y="33" width="140" height="52" rx="6"/><text x="720" y="56" text-anchor="middle">srt sandbox</text><text class="sub" x="720" y="72" text-anchor="middle">kernel enforcement</text></g><g class="n accent"><rect x="10" y="166.5" width="156" height="80" rx="6"/><text x="22" y="187.5">twsrt doctor</text><text class="ln" x="22" y="203.5">valid, no dead weight?</text><text class="ln" x="22" y="219.5">every profile</text><text class="ln" x="22" y="235.5">exit 0 ok · 1 errors</text></g><g class="n accent"><rect x="248" y="166.5" width="176" height="80" rx="6"/><text x="260" y="187.5">twsrt diff</text><text class="ln" x="260" y="203.5">files match fragments?</text><text class="ln" x="260" y="219.5">one profile (<tspan class="mono">-p</tspan>)</text><text class="ln" x="260" y="235.5">exit 0 · 1 drift · 2 missing</text></g><g class="n accent"><rect x="556" y="166.5" width="168" height="80" rx="6"/><text x="568" y="187.5">twsrt test</text><text class="ln" x="568" y="203.5">srt enforces the file?</text><text class="ln" x="568" y="219.5">one profile (<tspan class="mono">-p</tspan>)</text><text class="ln" x="568" y="235.5">exit 0 · 1 fail · 2 setup</text></g><text class="el" x="240" y="54" text-anchor="middle">generate -w</text><text class="el" x="560" y="54" text-anchor="middle">read at launch</text><line class="e " x1="12" x2="44" y1="-18" y2="-18"/><text class="lg" x="52" y="-14">generate</text><line class="e  dashed" x1="128" x2="160" y1="-18" y2="-18"/><text class="lg" x="168" y="-14">read at runtime</text><line class="e accent dashed" x1="289.5" x2="321.5" y1="-18" y2="-18"/><text class="lg" x="329.5" y="-14">checks (writes nothing)</text></svg>
