<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -36 800 330" width="800" height="330" role="img" aria-label="Compile once per profile, then translate per agent"><title>Compile once per profile, then translate per agent</title><style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.n rect { fill: #fff; stroke: #818b98; stroke-width: 1.5; }
.n.accent rect { stroke: #0969da; } .n.success rect { stroke: #1a7f37; }
.n.danger rect { stroke: #d1242f; } .n.attention rect { stroke: #9a6700; }
.n.muted rect { stroke: #d1d9e0; stroke-dasharray: 4 3; }
.n text { font-size: 13px; font-weight: 600; fill: #1f2328; }
.n text.sub { font-size: 11px; font-weight: 400; fill: #59636e; }
.n text.ln { font-size: 11.5px; font-weight: 400; fill: #1f2328; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-weight: 400; }
.e { fill: none; stroke: #818b98; stroke-width: 1.5; }
.e.dashed { stroke-dasharray: 5 4; } .e.strong { stroke-width: 2.5; }
.e.accent { stroke: #0969da; } .e.success { stroke: #1a7f37; }
.e.danger { stroke: #d1242f; } .e.attention { stroke: #9a6700; }
.el { font-size: 11px; fill: #59636e; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.lg { font-size: 12px; fill: #59636e; }
.grp rect { fill: #f6f8fa; stroke: #d1d9e0; stroke-dasharray: 6 4; }
.grp text { font-size: 12px; font-weight: 600; fill: #59636e; }
</style><rect x="0" y="-36" width="800" height="330" fill="#fff"/><defs><marker id="compile-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#818b98"/></marker><marker id="compile-accent" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="compile-success" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="compile-danger" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d1242f"/></marker><marker id="compile-attention" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker></defs><path class="e " d="M153,60 Q160,60 167,60" marker-end="url(#compile-neutral)"/><path class="e " d="M313,60 Q320,60 327,60" marker-end="url(#compile-neutral)"/><path class="e " d="M473,60 Q480,60 487,60" marker-end="url(#compile-neutral)"/><path class="e " d="M633,60 Q640,60 647,60" marker-end="url(#compile-neutral)"/><path class="e " d="M400,89 Q400,135 400,159" marker-end="url(#compile-neutral)"/><path class="e " d="M718.4533333333334,89 Q716,135 714.72,159" marker-end="url(#compile-neutral)"/><path class="e  dashed" d="M313,210 Q240,210 153,210" marker-end="url(#compile-neutral)"/><g class="n "><rect x="10" y="34" width="140" height="52" rx="6"/><text x="80" y="57" text-anchor="middle">Fragments</text><text class="sub" x="80" y="73" text-anchor="middle">JSONC</text></g><g class="n "><rect x="170" y="34" width="140" height="52" rx="6"/><text x="240" y="57" text-anchor="middle">Compose</text><text class="sub" x="240" y="73" text-anchor="middle">profile selects</text></g><g class="n accent"><rect x="330" y="34" width="140" height="52" rx="6"/><text x="400" y="57" text-anchor="middle">Canonical docs</text><text class="sub" x="400" y="73" text-anchor="middle">source of truth</text></g><g class="n "><rect x="490" y="34" width="140" height="52" rx="6"/><text x="560" y="57" text-anchor="middle">Normalized rules</text><text class="sub" x="560" y="73" text-anchor="middle">parsed, in memory</text></g><g class="n "><rect x="650" y="34" width="140" height="52" rx="6"/><text x="720" y="57" text-anchor="middle">Generators</text><text class="sub" x="720" y="73" text-anchor="middle">one per agent</text></g><g class="n "><rect x="316" y="162" width="168" height="96" rx="6"/><text x="328" y="183">Canonical files</text><text class="ln" x="328" y="199"><tspan class="mono">srt-settings.json</tspan></text><text class="ln" x="328" y="215"><tspan class="mono">bash-rules.json</tspan></text><text class="ln" x="328" y="231">written by any <tspan class="mono">-w</tspan></text><text class="ln" x="328" y="247">inspect: <tspan class="mono">twsrt show</tspan></text></g><g class="n "><rect x="628" y="162" width="168" height="96" rx="6"/><text x="640" y="183">Agent configs</text><text class="ln" x="640" y="199">translated, lossy</text><text class="ln" x="640" y="215">written by</text><text class="ln" x="640" y="231"><tspan class="mono">generate &lt;agent> -w</tspan></text><text class="ln" x="640" y="247">preview: omit <tspan class="mono">-w</tspan></text></g><g class="n muted"><rect x="10" y="184" width="140" height="52" rx="6"/><text x="80" y="207" text-anchor="middle">srt sandbox</text><text class="sub" x="80" y="223" text-anchor="middle">reads its file</text></g><text class="el" x="236.5" y="205" text-anchor="middle">read at launch</text><line class="e " x1="12" x2="44" y1="-18" y2="-18"/><text class="lg" x="52" y="-14">compile and translate</text><line class="e  dashed" x1="212.5" x2="244.5" y1="-18" 