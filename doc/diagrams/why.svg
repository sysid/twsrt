<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 798 440" width="798" height="440" role="img" aria-label="One policy, compiled into every agent's native configuration"><title>One policy, compiled into every agent's native configuration</title><style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.n rect { fill: #fff; stroke: #818b98; stroke-width: 1.5; }
.n.accent rect { stroke: #0969da; } .n.success rect { stroke: #1a7f37; }
.n.danger rect { stroke: #d1242f; } .n.attention rect { stroke: #9a6700; }
.n.muted rect { stroke: #d1d9e0; stroke-dasharray: 4 3; }
.n text { font-size: 13px; font-weight: 600; fill: #1f2328; }
.n text.sub { font-size: 11px; font-weight: 400; fill: #59636e; }
.n text.ln { font-size: 11.5px; font-weight: 400; fill: #1f2328; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-weight: 400; }
.e { fill: none; stroke: #818b98; stroke-width: 1.5; }
.e.dashed { stroke-dasharray: 5 4; } .e.strong { stroke-width: 2.5; }
.e.accent { stroke: #0969da; } .e.success { stroke: #1a7f37; }
.e.danger { stroke: #d1242f; } .e.attention { stroke: #9a6700; }
.el { font-size: 11px; fill: #59636e; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.lg { font-size: 12px; fill: #59636e; }
.grp rect { fill: #f6f8fa; stroke: #d1d9e0; stroke-dasharray: 6 4; }
.grp text { font-size: 12px; font-weight: 600; fill: #59636e; }
</style><rect x="0" y="0" width="798" height="440" fill="#fff"/><defs><marker id="why-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#818b98"/></marker><marker id="why-accent" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="why-success" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="why-danger" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d1242f"/></marker><marker id="why-attention" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker></defs><path class="e " d="M246,187.09924812030076 Q266,191.4 311,201.0766917293233" marker-end="url(#why-neutral)"/><path class="e " d="M246,252.90075187969924 Q266,248.6 311,238.9233082706767" marker-end="url(#why-neutral)"/><path class="e " d="M399,191 L399,44 L552,44" marker-end="url(#why-neutral)"/><path class="e " d="M399,191 L399,132 L552,132" marker-end="url(#why-neutral)"/><path class="e " d="M487,220 Q532,220 552,220" marker-end="url(#why-neutral)"/><path class="e " d="M399,249 L399,308 L552,308" marker-end="url(#why-neutral)"/><path class="e " d="M399,249 L399,396 L552,396" marker-end="url(#why-neutral)"/><g class="n "><rect x="23" y="122.80000000000001" width="220" height="80" rx="6"/><text x="35" y="143.8">Policy fragments</text><text class="sub" x="35" y="159.8">you edit</text><text class="ln" x="35" y="175.8"><tspan class="mono">srt/*.jsonc</tspan>: paths, domains</text><text class="ln" x="35" y="191.8"><tspan class="mono">bash/*.jsonc</tspan>: commands</text></g><g class="n "><rect x="23" y="237.2" width="220" height="80" rx="6"/><text x="35" y="258.2">config.toml</text><text class="sub" x="35" y="274.2">you edit</text><text class="ln" x="35" y="290.2">profiles: which fragments</text><text class="ln" x="35" y="306.2">targets: which agents</text></g><g class="n accent"><rect x="314" y="194" width="170" height="52" rx="6"/><text x="399" y="217" text-anchor="middle">twsrt generate -w</text><text class="sub" x="399" y="233" text-anchor="middle">compile + translate</text></g><g class="n "><rect x="555" y="20" width="220" height="48" rx="6"/><text x="567" y="41">srt sandbox</text><text class="ln" x="567" y="57"><tspan class="mono">~/.srt-settings.json</tspan></text></g><g class="n "><rect x="555" y="108" width="220" height="48" rx="6"/><text x="567" y="129">Claude Code</text><text class="ln" x="567" y="145"><tspan class="mono">~/.claude/settings.json</tspan></text></g><g class="n "><rect x="555" y="188" width="220" height="64" rx="6"/><text x="567" y="209">Codex</text><text class="ln" x="567" y="225"><tspan class="mono">~/.codex/config.toml</tspan></text><text class="ln" x="567" y="241"><tspan class="mono">~/.codex/rules/twsrt.rules</tspan></text></g><g class="n "><rect x="555" y="276" width="220" height="64" rx="6"/><text x="567" y="297">Copilot CLI</text><text class="ln" x="567" y="313"><tspan class="mono">~/.copilot/settings.json</tspan></text><text class="ln" x="567" y="329">flag snippet</text></g><g class="n "><rect x="555" y="372" width="220" height="48" rx="6"/><text x="567" y="393">Copilot in JetBrains</text><text class="ln" x="567" y="409"><tspan class="mono">github-copilot.xml</tspan> per IDE</text></g></svg>
